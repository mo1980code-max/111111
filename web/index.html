<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Reader</title>
  <!-- Google Fonts CDN: Amiri & Scheherazade New -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --quran-paper: #FBF9F0;
      --quran-ink: #1A1A1A;
      --quran-muted: #7A7A7A;
      --quran-selected: #D0ECE4;
      --quran-green: #2D7D46;
      --quran-green-hover: #246438;
      --quran-error: #C62828;
      --quran-border: #E8E4D5;
      --font-quran: 'Amiri', 'Scheherazade New', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--quran-paper);
      color: var(--quran-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--quran-paper);
      border-bottom: 1px solid var(--quran-border);
      padding: 12px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .surah-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .surah-select {
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--quran-ink);
      background-color: #FFFFFF;
      border: 1px solid var(--quran-border);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .surah-select:focus {
      border-color: var(--quran-green);
    }

    .btn-nav {
      background-color: #FFFFFF;
      color: var(--quran-ink);
      border: 1px solid var(--quran-border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-nav:hover:not(:disabled) {
      background-color: var(--quran-selected);
      border-color: var(--quran-green);
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--quran-muted);
    }

    .badge {
      background-color: #FFFFFF;
      border: 1px solid var(--quran-border);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 500;
    }

    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon {
      background: #FFFFFF;
      border: 1px solid var(--quran-border);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--quran-ink);
    }

    .btn-icon:hover {
      background: var(--quran-selected);
    }

    /* Main Content Area */
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 48px;
      display: flex;
      flex-direction: column;
    }

    .surah-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--quran-border);
    }

    .surah-title {
      font-family: var(--font-quran);
      font-size: 32px;
      font-weight: 700;
      color: var(--quran-green);
      margin-bottom: 4px;
    }

    .surah-subtitle {
      font-size: 14px;
      color: var(--quran-muted);
    }

    /* Verses Display */
    .verses-container {
      font-family: var(--font-quran);
      font-size: 28px;
      line-height: 2.3;
      text-align: justify;
      text-align-last: center;
      direction: rtl;
      word-spacing: 4px;
      background-color: transparent;
    }

    .ayah-span {
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }

    .ayah-span:hover {
      background-color: rgba(208, 236, 228, 0.5);
    }

    .ayah-span.selected {
      background-color: var(--quran-selected);
    }

    .ayah-marker {
      display: inline-block;
      margin: 0 4px;
      font-size: 0.85em;
      color: var(--quran-green);
      user-select: none;
    }

    /* Loading Spinner */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(45, 125, 70, 0.15);
      border-top-color: var(--quran-green);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 16px;
      color: var(--quran-muted);
    }

    /* Error View */
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      gap: 16px;
      text-align: center;
    }

    .error-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #FFEBEE;
      color: var(--quran-error);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }

    .error-message {
      font-size: 16px;
      color: var(--quran-muted);
      max-width: 400px;
    }

    .btn-retry {
      background-color: var(--quran-green);
      color: #FFFFFF;
      border: none;
      border-radius: 24px;
      padding: 10px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-retry:hover {
      background-color: var(--quran-green-hover);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--quran-border);
      padding: 16px 20px;
      text-align: center;
      font-size: 13px;
      color: var(--quran-muted);
      background-color: var(--quran-paper);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .verses-container {
        font-size: 24px;
        line-height: 2.1;
      }
      .surah-title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="nav-container">
      <div class="surah-controls">
        <button id="btnPrev" class="btn-nav" title="السورة السابقة">&rarr; السابقة</button>
        <select id="surahSelect" class="surah-select"></select>
        <button id="btnNext" class="btn-nav" title="السورة التالية">التالية &larr;</button>
      </div>

      <div class="header-badges">
        <span id="badgeJuz" class="badge">الجزء ١</span>
        <span id="badgePage" class="badge">صفحة ١</span>
        <div class="font-size-controls">
          <button id="btnFontPlus" class="btn-icon" title="تكبير الخط">A+</button>
          <button id="btnFontMinus" class="btn-icon" title="تصغير الخط">A-</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Reader Body -->
  <main>
    <!-- Loading State -->
    <div id="loadingState" class="loading-container">
      <div class="spinner"></div>
      <div class="loading-text">جاري تحميل السورة…</div>
    </div>

    <!-- Error State with Retry -->
    <div id="errorState" class="error-container hidden">
      <div class="error-icon">!</div>
      <div id="errorMessage" class="error-message">تعذر تحميل بيانات السورة. يرجى التحقق من اتصال الإنترنت والمحاولة مجددًا.</div>
      <button id="btnRetry" class="btn-retry">إعادة المحاولة</button>
    </div>

    <!-- Content State -->
    <div id="contentState" class="hidden">
      <div class="surah-header">
        <h1 id="surahTitle" class="surah-title"></h1>
        <div id="surahSubtitle" class="surah-subtitle"></div>
      </div>
      <div id="versesContainer" class="verses-container"></div>
    </div>
  </main>

  <footer>
    <span id="footerText">القرآن الكريم — نص عثماني</span>
  </footer>

  <script>
    (function () {
      // Surah Names Array (1 to 114)
      const SURAH_NAMES = [
        "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
        "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
        "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
        "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
        "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
        "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
        "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
        "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
        "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
        "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
        "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
        "المسد", "الإخلاص", "الفلق", "الناس"
      ];

      // Cache storage
      const memoryCache = new Map();
      const CACHE_PREFIX = "quran_surah_v1_";
      const API_URL = "https://api.alquran.cloud/v1/surah/{number}/quran-uthmani";

      // State
      let currentSurah = 1;
      let selectedAyah = 1;
      let currentVersesData = [];
      let fontSize = 28;

      // DOM Elements
      const surahSelect = document.getElementById("surahSelect");
      const btnPrev = document.getElementById("btnPrev");
      const btnNext = document.getElementById("btnNext");
      const btnRetry = document.getElementById("btnRetry");
      const btnFontPlus = document.getElementById("btnFontPlus");
      const btnFontMinus = document.getElementById("btnFontMinus");
      const badgeJuz = document.getElementById("badgeJuz");
      const badgePage = document.getElementById("badgePage");
      const loadingState = document.getElementById("loadingState");
      const errorState = document.getElementById("errorState");
      const contentState = document.getElementById("contentState");
      const errorMessage = document.getElementById("errorMessage");
      const surahTitle = document.getElementById("surahTitle");
      const surahSubtitle = document.getElementById("surahSubtitle");
      const versesContainer = document.getElementById("versesContainer");

      // Convert western digits to Arabic-Indic digits
      function toArabicDigits(num) {
        return String(num).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
      }

      // Initialize Surah Dropdown
      function initSelect() {
        surahSelect.innerHTML = "";
        SURAH_NAMES.forEach((name, idx) => {
          const opt = document.createElement("option");
          opt.value = idx + 1;
          opt.textContent = `${idx + 1}. سورة ${name}`;
          surahSelect.appendChild(opt);
        });
      }

      // Fetch with Memory & LocalStorage Caching
      async function fetchSurah(surahNum) {
        // 1. Check in-memory cache
        if (memoryCache.has(surahNum)) {
          return memoryCache.get(surahNum);
        }

        // 2. Check localStorage cache
        try {
          const cached = localStorage.getItem(CACHE_PREFIX + surahNum);
          if (cached) {
            const parsed = JSON.parse(cached);
            memoryCache.set(surahNum, parsed);
            return parsed;
          }
        } catch (e) {
          console.warn("localStorage read error:", e);
        }

        // 3. Dynamic fetch from API
        const endpoint = API_URL.replace("{number}", surahNum);
        const res = await fetch(endpoint);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        const json = await res.json();
        if (json.code !== 200 || !json.data) {
          throw new Error(json.status || "Failed to load Surah data");
        }

        const data = json.data;
        // Save to memory cache
        memoryCache.set(surahNum, data);
        // Save to localStorage
        try {
          localStorage.setItem(CACHE_PREFIX + surahNum, JSON.stringify(data));
        } catch (e) {
          console.warn("localStorage write error:", e);
        }

        return data;
      }

      // UI View Transitions
      function showLoading() {
        loadingState.classList.remove("hidden");
        errorState.classList.add("hidden");
        contentState.classList.add("hidden");
      }

      function showError(msg) {
        loadingState.classList.add("hidden");
        errorState.classList.remove("hidden");
        contentState.classList.add("hidden");
        errorMessage.textContent = msg || "تعذر تحميل بيانات السورة. يرجى المحاولة مجددًا.";
      }

      function showContent() {
        loadingState.classList.add("hidden");
        errorState.classList.add("hidden");
        contentState.classList.remove("hidden");
      }

      // Select and Highlight Ayah
      function selectAyah(ayahNumber) {
        selectedAyah = ayahNumber;
        const spans = versesContainer.querySelectorAll(".ayah-span");
        spans.forEach(span => {
          if (parseInt(span.dataset.ayah, 10) === ayahNumber) {
            span.classList.add("selected");
          } else {
            span.classList.remove("selected");
          }
        });

        if (currentVersesData && currentVersesData[ayahNumber - 1]) {
          const verse = currentVersesData[ayahNumber - 1];
          badgeJuz.textContent = `الجزء ${toArabicDigits(verse.juz || 1)}`;
          badgePage.textContent = `صفحة ${toArabicDigits(verse.page || 1)}`;
        }
      }

      // Render Surah Content
      function renderSurah(data) {
        surahTitle.textContent = data.name || `سورة ${SURAH_NAMES[data.number - 1]}`;
        surahSubtitle.textContent = `${data.englishName || ''} • ${data.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} • عدد الآيات: ${toArabicDigits(data.numberOfAyahs || data.ayahs.length)}`;

        currentVersesData = data.ayahs || [];
        versesContainer.innerHTML = "";

        const fragment = document.createDocumentFragment();
        currentVersesData.forEach(ayah => {
          const span = document.createElement("span");
          span.className = "ayah-span";
          span.dataset.ayah = ayah.numberInSurah;

          const textNode = document.createTextNode(ayah.text + " ");
          span.appendChild(textNode);

          const marker = document.createElement("span");
          marker.className = "ayah-marker";
          marker.textContent = `\uFD3F ${toArabicDigits(ayah.numberInSurah)} \uFD3E`;
          span.appendChild(marker);

          span.addEventListener("click", () => {
            selectAyah(ayah.numberInSurah);
          });

          fragment.appendChild(span);
          fragment.appendChild(document.createTextNode(" "));
        });

        versesContainer.appendChild(fragment);
        showContent();
        selectAyah(1);

        // Update Nav button states
        btnPrev.disabled = currentSurah <= 1;
        btnNext.disabled = currentSurah >= 114;
        surahSelect.value = currentSurah;
      }

      // Load Surah
      async function loadSurah(surahNum) {
        currentSurah = surahNum;
        showLoading();
        try {
          const data = await fetchSurah(surahNum);
          renderSurah(data);
        } catch (err) {
          console.error("Failed to load Surah:", err);
          showError("تعذر الاتصال بالخادم لتحميل السورة. يرجى التحقق من اتصال الإنترنت والضغط على إعادة المحاولة.");
        }
      }

      // Event Listeners
      surahSelect.addEventListener("change", (e) => {
        loadSurah(parseInt(e.target.value, 10));
      });

      btnPrev.addEventListener("click", () => {
        if (currentSurah > 1) {
          loadSurah(currentSurah - 1);
        }
      });

      btnNext.addEventListener("click", () => {
        if (currentSurah < 114) {
          loadSurah(currentSurah + 1);
        }
      });

      btnRetry.addEventListener("click", () => {
        loadSurah(currentSurah);
      });

      btnFontPlus.addEventListener("click", () => {
        if (fontSize < 44) {
          fontSize += 2;
          versesContainer.style.fontSize = fontSize + "px";
        }
      });

      btnFontMinus.addEventListener("click", () => {
        if (fontSize > 18) {
          fontSize -= 2;
          versesContainer.style.fontSize = fontSize + "px";
        }
      });

      // Initialization
      initSelect();
      loadSurah(1);
    })();
  </script>
</body>
</html>
