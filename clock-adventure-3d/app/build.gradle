plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

apply from: "$rootDir/dependencies.gradle"

android {
    namespace appId
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId appId
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCodeValue
        versionName rootProject.ext.versionNameValue

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs rootProject.ext.supportedLocales.join(',')
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
        coreLibraryDesugaringEnabled false
    }

    kotlinOptions {
        jvmTarget = rootProject.ext.javaVersion.toString()
        freeCompilerArgs += [
                "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
        ]
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    // One APK per ABI/density is not needed for an offline kids game shipped through Play
    // (App Bundle splits handle that); keeping a single universal artefact makes sideloading the
    // debug build simpler for testers.
    bundle {
        language { enableSplit false }
    }
}

dependencies {
    implementation project(':domain')
    implementation project(':data')
    implementation project(':presentation')

    implementation rootProject.ext.versions.coreKtx
    implementation rootProject.ext.versions.appCompat
    implementation rootProject.ext.versions.kotlinxCoroutinesAndroid

    implementation platform(rootProject.ext.versions.composeBom)
    implementation rootProject.ext.versions.composeUi
    implementation rootProject.ext.versions.composeUiGraphics
    implementation rootProject.ext.versions.composeUiToolingPreview
    implementation rootProject.ext.versions.composeMaterial3
    debugImplementation rootProject.ext.versions.composeUiTooling

    implementation rootProject.ext.versions.activityCompose
    implementation rootProject.ext.versions.lifecycleRuntimeCompose
    implementation rootProject.ext.versions.lifecycleViewModelCompose
    implementation rootProject.ext.versions.navigationCompose
    implementation rootProject.ext.versions.hiltNavigationCompose

    implementation rootProject.ext.versions.hiltAndroid
    ksp rootProject.ext.versions.hiltCompiler
    implementation rootProject.ext.versions.javaxInject

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
