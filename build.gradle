// Root build file. Versions are declared once here and reused by :app.
//
// Offline-first product rule: only google() and mavenCentral() are needed. jitpack was dropped
// together with the retired colour-picker of the legacy clock editor, so dependency resolution no
// longer depends on a third-party mirror.
buildscript {
    ext {
        kotlinVersion = '2.1.20'
        hiltVersion = '2.56.2'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
