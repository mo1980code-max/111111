# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http:

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Jetifier rewrites android.support.* to androidx.* *inside* third-party AAR/JAR artifacts. To do
# that it unzips every dependency and re-parses the XML it finds with a StAX reader, which throws
# a bare NullPointerException ("Cannot invoke javax.xml.stream.events.Attribute.getValue() because
# ... getAttributeByName(...) is null") when an artifact's XML omits an attribute it expected. That
# crash names no file, so it looks like a bug in this project's res/ even though the XML at fault
# is inside somebody else's .aar and cannot be edited here.
#
# Nothing in this build needs the rewrite: every dependency is already AndroidX or has no support
# library at all (com.github.QuadFlask:colorpicker resolves to androidx.appcompat:appcompat), and
# the only "android.support" string in the whole project is the FILE_PROVIDER_PATHS meta-data name
# in AndroidManifest.xml, which is a literal key and must NOT be rewritten. Leaving the flag on
# bought nothing and kept a fragile XML pass in the build.
#
# Verify before turning this back on: ./gradlew checkJetifier names any dependency that still
# needs it. If it names none, leave this false.
android.enableJetifier=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http:
# org.gradle.parallel=true

# AGP 8 defaults to non-final R IDs; legacy EditorActivity uses switch (R.id...).
android.nonFinalResIds=false
