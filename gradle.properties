# Project-wide Gradle settings.
#
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override* any settings specified in this file.

# Jetifier rewrites android.support.* to androidx.* inside third-party artifacts. Nothing in this
# build needs it: every dependency is AndroidX first-party (Compose, Room, DataStore, Navigation,
# Lifecycle) or Dagger/Hilt, which has no support-library reference at all.
# Verify before turning this back on: ./gradlew checkJetifier names any dependency that needs it.
android.enableJetifier=false
android.useAndroidX=true

# kapt (Hilt + Room annotation processors) needs more head-room than the AGP default.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
# Keep the incremental/worker defaults of kapt; Hilt's aggregating processor is the slow step and
# it is already incremental-friendly in 2.56.
kapt.incremental.apt=true
kapt.use.worker.api=true
