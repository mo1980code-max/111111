apply plugin: 'com.android.application'

android {
    compileSdk 36
    namespace 'com.clock.livewallpaper'
    defaultConfig {
        applicationId "com.clock.livewallpaper"
        minSdk 23
        targetSdk 36
        versionCode 1
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "en"
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // dataBinding is deliberately NOT enabled. It was on while no layout used it: there is no
    // <layout> root, no <data>/<variable> block, no @{...} expression and no DataBindingUtil /
    // BindingAdapter / BaseObservable anywhere in src/main/java. Enabling it still made AGP run
    // its StAX layout parser over every file in res/layout on each build, and that parser reports
    // a missing attribute as a bare NullPointerException ("Cannot invoke
    // javax.xml.stream.events.Attribute.getValue() because ... getAttributeByName(...) is null")
    // with no file or line, instead of an AAPT2 error pointing at the offending tag.
    // Re-add `buildFeatures { dataBinding true }` when a layout actually gains a <layout> root.
    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit false
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

}
// Selects the compiler JDK; also run Gradle itself with JDK 17 (JAVA_HOME/Android Studio).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    // The clock and wallpaper browsers read their artwork from assets/ through
    // com.clock.livewallpaper.image.LocalImage, so the image loading stack the old build carried
    // (Glide, Picasso, Volley, okdownload, FileDownloader, OkHttp) and the remote wallpaper APIs are
    // gone on purpose: nothing in this app can fetch a picture over the network any more.
    implementation 'com.github.QuadFlask:colorpicker:0.0.14'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    // Swipe navigation between surahs: one QuranFragment per surah inside a FragmentStateAdapter.
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

}
